# Default configuration applied by commons-rest-openapi.
# These are low-precedence defaults and can be overridden in the consuming application.
#
# The TypeScript/Zod client generator re-parses the served OpenAPI document via
# swagger-core (io.github.vpelikh Jackson 3 fork). That parser cannot deserialize
# the OpenAPI 3.1 style "type": ["object", "null"] arrays that springdoc emits for
# nullable schemas, so we default the served document to OpenAPI 3.0.
# See swagger-api/swagger-core#4991.
springdoc.api-docs.version=openapi_3_0
