# database connection
spring:
  datasource:
    url: 'jdbc:h2:mem:testdb'
    username: 'sa'
    password: 'password'
    driverClassName: org.h2.Driver
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # json configuration
  jackson:
    serialization:
      INDENT_OUTPUT: true
    # Jackson 3 moved WRITE_DATES_AS_TIMESTAMPS from SerializationFeature to DateTimeFeature
    datatype:
      datetime:
        WRITE_DATES_AS_TIMESTAMPS: false
    default-property-inclusion: non_null

logging:
  level:
    root: info
    io.rocketbase: DEBUG

commons:
  logging:
    args: false
    result: false
    query: true
